<!-- Corrections toggle: set the class before first paint so hidden boxes never flash. -->
<script>
  try {
    if (localStorage.getItem('showCorrections') === '1') {
      document.documentElement.classList.add('show-corrections');
    }
  } catch (e) {}
</script>

<!-- Digital rain behind the page. Throttled, paused in hidden tabs, off for reduced motion. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var canvas = document.createElement('canvas');
    canvas.id = 'sw-rain';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.prepend(canvas);
    var ctx = canvas.getContext('2d');
    var glyphs = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
    var size = 16, cols = 0, drops = [], gold = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      cols = Math.ceil(canvas.width / size);
      drops = []; gold = [];
      for (var i = 0; i < cols; i++) {
        drops[i] = Math.random() * -canvas.height / size;
        gold[i] = Math.random() < 0.06;
      }
    }

    function frame() {
      ctx.fillStyle = 'rgba(3, 8, 7, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = size + 'px "Share Tech Mono", monospace';
      for (var i = 0; i < cols; i++) {
        var ch = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
        ctx.fillStyle = gold[i] ? '#d9a93f' : (Math.random() < 0.1 ? '#c8ffe0' : '#3ddc84');
        ctx.fillText(ch, i * size, drops[i] * size);
        if (drops[i] * size > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
          gold[i] = Math.random() < 0.06;
        }
        drops[i] += 1;
      }
    }

    resize();
    window.addEventListener('resize', resize);
    var timer = null;
    function start() { if (!timer) timer = setInterval(frame, 60); }
    function stop() { clearInterval(timer); timer = null; }
    document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
    start();
  });
</script>
