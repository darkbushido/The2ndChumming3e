{%- if site.sr3e_version -%}
<a class="guides-version" href="{{ site.sr3e_versions_url }}" title="These guides describe how this version of The 2nd Chumming handles the rules. Other versions">{{ site.sr3e_version }}</a>
{%- endif -%}
<label class="corrections-toggle" title="Show what was corrected from the original Gemini gists">
  <input type="checkbox" id="show-corrections">
  Show corrections
</label>
<script>
  (function () {
    var box = document.getElementById('show-corrections');
    var root = document.documentElement;
    box.checked = root.classList.contains('show-corrections');
    box.addEventListener('change', function () {
      root.classList.toggle('show-corrections', box.checked);
      try { localStorage.setItem('showCorrections', box.checked ? '1' : '0'); } catch (e) {}
    });
  })();
</script>
