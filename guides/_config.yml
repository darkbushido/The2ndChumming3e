title: SR3 Table Reference
description: >-
  Unofficial Shadowrun 3rd Edition reference pages for players and GMs,
  checked against the rulebooks with a book and page for every rule.
theme: just-the-docs

# The guides live in The2ndChumming3e's guides/ folder. A release build overrides
# baseurl per version (/The2ndChumming3e/v0.6.0, /latest) - .github/workflows/release.yml.
baseurl: "/The2ndChumming3e"
permalink: pretty
url: "https://darkbushido.github.io"

color_scheme: sixthworld
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Unofficial fan reference. Shadowrun is a registered trademark of its
  owners; no challenge to their rights is intended. Page numbers refer to
  the printed page of each book, not the PDF page.

callouts_level: quiet
callouts:
  fixed:
    title: Corrected from the original gist
    color: yellow
  house:
    title: House rule, not in the books
    color: purple
  note:
    title: Note
    color: blue
  rule:
    title: Rule text
    color: green

# Plain Jekyll (as used by the Actions build) applies no layout unless told to.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - TODO.md
  - tools
  - vendor
  - .bundle
