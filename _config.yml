title: SR3 Table Reference
description: >-
  Unofficial Shadowrun 3rd Edition reference pages for players and GMs,
  checked against the rulebooks with a book and page for every rule.
theme: just-the-docs

# GitHub Pages project sites live under /<repo-name>. Change this if the
# repository is renamed.
baseurl: "/sr3-guides"
permalink: pretty
url: "https://darkbushido.github.io"

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Unofficial fan reference. Shadowrun is a registered trademark of its
  owners; no challenge to their rights is intended. Page numbers refer to
  the printed page of each book, not the PDF page.

callouts_level: quiet
callouts:
  fixed:
    title: Corrected from the original gist
    color: yellow
  house:
    title: House rule, not in the books
    color: purple
  note:
    title: Note
    color: blue
  rule:
    title: Rule text
    color: green

# Plain Jekyll (as used by the Actions build) applies no layout unless told to.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
