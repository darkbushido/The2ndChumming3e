<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tiling smoke: drifting grey cloud, seamless (stitchTiles). A Region pattern for a smoke grenade, TODO 164. -->
  <defs>
    <filter id="s" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.62
                0 0 0 0 0.64
                0 0 0 0 0.67
                0 0 0 1.9 -0.55"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#s)"/>
</svg>
