<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tiling gas: a thin green haze with finer, faster swirls than smoke. TODO 164. -->
  <defs>
    <filter id="s" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.022 0.03" numOctaves="3" seed="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.80
                0 0 0 0 0.44
                0 0 0 1.5 -0.25"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#s)"/>
</svg>
